<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 380px; margin: 0; padding: 18px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0b1220; color: #e2e8f0;
    }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    header img { width: 26px; height: 26px; }
    h1 { font-size: 14px; margin: 0; color: #f59e0b; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
    .ver { font-size: 10px; color: #64748b; margin-left: auto; font-family: ui-monospace, monospace; }
    label { display: block; font-size: 11px; color: #94a3b8; margin: 10px 0 5px; text-transform: uppercase; letter-spacing: .08em; }
    input, textarea {
      width: 100%; padding: 9px 10px; border: 1px solid #334155; border-radius: 8px;
      background: #111d33; color: #e2e8f0; font-size: 13px;
    }
    textarea {
      min-height: 78px; resize: vertical; font-size: 11.5px; line-height: 1.45;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    input:focus, textarea:focus { outline: none; border-color: #f59e0b; box-shadow: 0 0 0 2px rgba(245,158,11,.15); }
    .hint { font-size: 10.5px; color: #64748b; margin-top: 4px; line-height: 1.4; }
    button {
      width: 100%; padding: 11px; margin-top: 10px; border: none; border-radius: 8px;
      font-size: 12.5px; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: .05em;
      transition: background .15s ease, opacity .15s ease;
    }
    .btn-primary { background: #f59e0b; color: #0b1220; }
    .btn-primary:hover { background: #fbbf24; }
    .btn-secondary { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; }
    .btn-secondary:hover { background: #273549; }
    .row { display: flex; gap: 8px; }
    .row button { width: 50%; }
    .status { margin-top: 12px; padding: 9px 10px; border-radius: 8px; font-size: 12px; line-height: 1.5; display: none; }
    .status.visible { display: block; }
    .status.error { background: #3f1d1d; color: #fca5a5; border: 1px solid #7f1d1d; }
    .status.success { background: #0f3320; color: #86efac; border: 1px solid #14532d; }
    .status.loading { background: #111d33; color: #94a3b8; border: 1px solid #334155; }
    .reset-link {
      background: none; border: none; color: #f59e0b; font-size: 10px; padding: 0; margin-top: 4px;
      text-transform: none; letter-spacing: 0; font-weight: 600; cursor: pointer; width: auto; display: inline-block;
    }
    .reset-link:hover { text-decoration: underline; background: none; }
  </style>
</head>
<body>
  <header>
    <img src="icon.svg" alt="">
    <h1>Offset RP — Lens Extractor</h1>
    <span class="ver">v4.0.0</span>
  </header>

  <label for="url">Link da imagem</label>
  <input type="text" id="url" placeholder="https://i.gyazo.com/....png" autofocus spellcheck="false">
  <div class="hint">Cola o link direto da imagem — ou usa o clique direito numa imagem &gt; <b>Extrair itens com Lens</b>. Também aceita um URL completo de google.com/search.</div>

  <label for="query">Query multimodal (editável)</label>
  <textarea id="query" spellcheck="false"></textarea>
  <button class="reset-link" id="resetQuery">Repor query predefinida</button>

  <button class="btn-primary" id="extract">Abrir Lens &amp; Extrair</button>
  <div class="row">
    <button class="btn-secondary" id="openSite">Abrir Calculadora</button>
    <button class="btn-secondary" id="openLens">Abrir Lens vazio</button>
  </div>

  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
